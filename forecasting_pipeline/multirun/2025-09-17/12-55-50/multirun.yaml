hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - save_path=../save_and_results/old/journal/journal_new
    - forecast_path=../save_and_results/new/journal/3
    - criteria=MAE
    - dir=lot,desc1
    - model_type=X
    - search=3_no_exogs.yaml
  job:
    name: forecast_points
    chdir: null
    override_dirname: criteria=MAE,dir=lot,desc1,forecast_path=../save_and_results/new/journal/3,model_type=X,save_path=../save_and_results/old/journal/journal_new,search=3_no_exogs.yaml
    id: ???
    num: ???
    config_name: forecast_config.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.4.0.dev1
    version_base: '1.4'
    cwd: /home/gideon/project_repos/KI4KI/forecasting_pipeline
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/gideon/project_repos/KI4KI/forecasting_pipeline/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      search: 3_no_exogs.yaml
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
search:
  order_high:
  - 3
  - 2
  - 3
  order_low:
  - 1
  - 0
  - 0
  fourier_orders:
  - 0
  mean_orders:
  - 0
  exog_steps: []
  decompose:
  - 0
  - 1
  n_estimators:
  - 50
  - 250
  max_depth:
  - None
  - 3
  - 7
  estimator:
  - dt
  - linear
  learning_rate:
  - 1.0
  - 0.1
  interaction:
  - 0
model_type: X
loc: Moehne
dir: lot
forecast_path: ../save_and_results/new/journal/3
save_path: ../save_and_results/old/journal/journal_new
criteria: MAE
parallel: false
remove_W: false
remove_T: false
remove_everything: false
source_path: ../raw_data/
cache_path: ../save_and_results
all_locs:
- Moehne
- Fuerwigge
- Verse
- Lister
- Bigge
- Sorpe
all_dirs:
- asc0
- ew
- ver
- desc0
all_model_types:
- linear
- sarimax
- forest
- ada
- var
